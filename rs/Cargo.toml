[package]
name = "tabnas-jsonl"
version = "0.1.10"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "JSON Lines (JSONL, NDJSON) grammar plugin for the tabnas parsing engine"
repository = "https://github.com/tabnas/jsonl"

[lib]
name = "tabnas_jsonl"
path = "src/lib.rs"

[dependencies]
# The engine and the strict-JSON grammar this plugin layers on are both
# consumed as SIBLING CHECKOUTS, the standard tabnas development model:
# clone https://github.com/tabnas/parser and https://github.com/tabnas/json
# next to this repo. Neither crate is published, so there is no registry
# version to fall back on.
tabnas = { path = "../../parser/rs" }
tabnas-json = { path = "../../json/rs" }
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The shared fixture runner: the Rust half of @tabnas/support, another
# sibling checkout (https://github.com/tabnas/support). The `serde_json`
# feature is the bridge from the engine's `Value::to_json` to the runner's
# fixture value.
tabnas-support = { path = "../../support/rs", features = ["serde_json"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
